# Every pull request and every push to main runs the same script a
# contributor runs: tools/verify.sh --fast. One list of gates, so CI and
# the laptop cannot disagree about what "green" means. --fast leaves out
# only the emulator run, which needs Node.js and the rp2040js checkout.
name: ci

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sign-off:
    # Every commit in a pull request carries a Developer Certificate of
    # Origin sign-off (CONTRIBUTING.md); `git commit -s` adds it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::commit $(git show -s --format='%h %s' "$c") has no Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off with: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never  # the clippy gate greps for lines starting "error"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: system libraries (libudev for the serial port, nasm for the image codecs)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev nasm pkg-config
      - name: the pinned toolchain and both ARM targets (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            firmware
      - name: tools/verify.sh --fast
        run: tools/verify.sh --fast
